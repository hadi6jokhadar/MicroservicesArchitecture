# PostgreSQL Replica Configuration
# This file is automatically regenerated by pg_basebackup's -R flag at container startup
# (see the postgres-replica `command:` in docker-compose.postgres-replication.yml) — the
# checked-in copy here is a reference only, never read as-is by a running container, so
# the password below is a placeholder, not a live credential.

# Connection to primary server
primary_conninfo = 'host=postgres-primary port=5432 user=replicator password=CHANGE_ME_REPLICATION_PASSWORD application_name=replica1'

# Replication slot
primary_slot_name = 'replication_slot'

# Enable hot standby (read-only queries on replica)
hot_standby = on
hot_standby_feedback = on

# Recovery settings
restore_command = ''
archive_cleanup_command = ''
