services:
  redis:
    image: redis:7-alpine
    container_name: redis
    # 127.0.0.1 only: this is the host-dev-mode Redis for services started via `dotnet run`,
    # not the containerized stack's redis — no other machine needs to reach it directly.
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
